<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Fábrica de Palavras</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(145deg,#fffbe6 0%,#e0f4ff 55%,#f3e8ff 100%)}
button:focus-visible{outline:2px solid #F4A821;outline-offset:2px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState} = React;

const PREFIXOS = ["des","in","im","a","re","anti","contra","ambi"];
const SUFIXOS_DISPLAY = [
  "o","a","ar","er","ir","or",
  "isar","izar","esa","eza","\u00eas","esia",
  "\u00e2nsia","\u00e2ncia","\u00eancia","ança","ansa","ença",
  "ice","ície","mente","ismo","\u00e7\u00e3o","agem","eiro","eira","osa"
];

const lbl = {fontSize:11,color:"#aaa",fontWeight:700,textTransform:"uppercase",letterSpacing:1,margin:"0 0 8px"};
const cardStyle = {background:"#fff",borderRadius:16,padding:"16px 18px",marginBottom:14,boxShadow:"0 2px 10px #0000000a"};

function Chip({bg,c,children}){
  return <span style={{background:bg,color:c,padding:"4px 12px",borderRadius:20,fontSize:12,fontWeight:700,display:"inline-block"}}>{children}</span>;
}

function AfixoBtn({text,selected,color,onClick,dim}){
  return(
    <button onClick={onClick} style={{
      margin:"3px 4px",padding:"7px 13px",
      background:selected?color:dim?"#f9f9f9":"#fff",
      color:selected?"#fff":dim?"#bbb":"#444",
      border:"2.5px solid "+(selected?color:dim?"#eee":"#ddd"),
      borderRadius:10,fontSize:14,fontWeight:700,fontFamily:"inherit",
      cursor:"pointer",
      transform:selected?"translateY(-2px)":"none",
      boxShadow:selected?"0 4px 10px "+color+"44":"0 1px 3px #0001",
      transition:"all .15s",
    }}>{text}</button>
  );
}

function HomeScreen({onStart}){
  return(
    <div style={{textAlign:"center",maxWidth:420}}>
      <div style={{fontSize:70,marginBottom:8}}>🏭</div>
      <h1 style={{fontFamily:"'Fredoka One',cursive",fontSize:40,color:"#2B2D42",margin:"0 0 12px"}}>
        Fábrica de Palavras
      </h1>
      <p style={{color:"#888",fontSize:16,lineHeight:1.7,marginBottom:36}}>
        Monte palavras com <strong>prefixos</strong> e <strong>sufixos</strong>.<br/>Aprenda brincando! ✨
      </p>
      <button onClick={onStart} style={{padding:"14px 52px",background:"#F4A821",color:"#fff",border:"none",borderRadius:50,fontSize:20,fontFamily:"inherit",fontWeight:700,cursor:"pointer",boxShadow:"0 6px 24px #F4A82144"}}>
        🚀 Começar!
      </button>
    </div>
  );
}

function SetupScreen({setup,setSetup,onGo,onBack}){
  const {radInput,prefSel,sufSel} = setup;
  const S = (key,val) => setSetup(s=>({...s,[key]:val}));
  const togglePref = p => S("prefSel", prefSel.includes(p)?prefSel.filter(x=>x!==p):[...prefSel,p]);
  const toggleSuf  = i => S("sufSel", sufSel.includes(i)?sufSel.filter(x=>x!==i):[...sufSel,i]);
  const bases = radInput.split(",").map(r=>r.trim()).filter(Boolean);
  const temAfixo = prefSel.length>0 || sufSel.length>0;
  const canGo = bases.length>0 && temAfixo;
  const motivo = bases.length===0?"Digite ao menos uma base":!temAfixo?"Selecione ao menos um afixo":"";

  return(
    <div style={{maxWidth:680,width:"100%"}}>
      <button onClick={onBack} style={{background:"none",border:"none",color:"#bbb",fontSize:13,cursor:"pointer",marginBottom:12}}>← Voltar</button>
      <h2 style={{fontSize:22,color:"#2B2D42",marginBottom:6}}>🎮 Configurar Sessão</h2>
      <p style={{fontSize:13,color:"#aaa",marginBottom:20}}>
        Escolha as bases e os afixos. No jogo, combine livremente — prefixo, 1 ou 2 sufixos.
      </p>

      <div style={cardStyle}>
        <p style={lbl}>🌱 Bases <span style={{color:"#C1121F"}}>*</span></p>
        <p style={{fontSize:12,color:"#bbb",margin:"0 0 10px"}}>Separe por v\u00edrgula. Ex: <em>feliz, terra, ativ, human</em></p>
        <textarea value={radInput} onChange={e=>S("radInput",e.target.value)}
          placeholder="ex: feliz, terra, ativ, human, viv" rows={2}
          style={{width:"100%",padding:"10px 14px",borderRadius:10,fontSize:15,border:"2px solid #e8e8e8",fontFamily:"inherit",outline:"none",resize:"vertical"}}
          onFocus={e=>e.target.style.border="2px solid #F4A821"}
          onBlur={e=>e.target.style.border="2px solid #e8e8e8"}/>
        {bases.length>0&&(
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginTop:10}}>
            {bases.map((r,i)=>(
              <span key={i} style={{background:"#FFF3E0",color:"#F4A821",padding:"5px 14px",borderRadius:20,fontSize:13,fontWeight:700}}>🌱 {r}</span>
            ))}
          </div>
        )}
      </div>

      <div style={cardStyle}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <p style={{...lbl,margin:0}}>⇐ Prefixos dispon\u00edveis</p>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>S("prefSel",[...PREFIXOS])} style={{background:"none",border:"none",color:"#C1121F",fontSize:11,cursor:"pointer",fontWeight:700}}>✓ Todos</button>
            {prefSel.length>0&&<button onClick={()=>S("prefSel",[])} style={{background:"none",border:"none",color:"#999",fontSize:11,cursor:"pointer",fontWeight:700}}>✕ Limpar</button>}
          </div>
        </div>
        <div style={{display:"flex",flexWrap:"wrap"}}>
          {PREFIXOS.map(p=><AfixoBtn key={p} text={p+"\u2013"} selected={prefSel.includes(p)} color="#C1121F" onClick={()=>togglePref(p)}/>)}
        </div>
      </div>

      <div style={cardStyle}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <p style={{...lbl,margin:0}}>⇒ Sufixos dispon\u00edveis</p>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>S("sufSel",SUFIXOS_DISPLAY.map((_,i)=>i))} style={{background:"none",border:"none",color:"#0077B6",fontSize:11,cursor:"pointer",fontWeight:700}}>✓ Todos</button>
            {sufSel.length>0&&<button onClick={()=>S("sufSel",[])} style={{background:"none",border:"none",color:"#999",fontSize:11,cursor:"pointer",fontWeight:700}}>✕ Limpar</button>}
          </div>
        </div>
        <div style={{display:"flex",flexWrap:"wrap"}}>
          {SUFIXOS_DISPLAY.map((s,i)=>(
            <AfixoBtn key={i} text={"\u2013"+s} selected={sufSel.includes(i)} color="#0077B6" onClick={()=>toggleSuf(i)}/>
          ))}
        </div>
        <p style={{fontSize:11,color:"#bbb",margin:"8px 0 0"}}>Pode usar 1 ou 2 sufixos na mesma palavra.</p>
      </div>

      {motivo&&<p style={{fontSize:13,color:"#B5601A",background:"#FFF8E1",borderRadius:10,padding:"8px 14px",marginBottom:14}}>⚠️ {motivo}</p>}

      <button onClick={onGo} disabled={!canGo} style={{width:"100%",padding:15,background:canGo?"#F4A821":"#e0e0e0",color:canGo?"#fff":"#bbb",border:"none",borderRadius:50,fontSize:18,fontFamily:"inherit",fontWeight:700,cursor:canGo?"pointer":"not-allowed",boxShadow:canGo?"0 5px 20px #F4A82133":"none",transition:"all .2s"}}>
        🏭 Iniciar Oficina!
      </button>
    </div>
  );
}

function GameScreen({exercicios,setup,pre,setPre,suf1,setSuf1,suf2,setSuf2,tentativas,score,idx,total,onRegistrar,onNext,onBack}){
  const ex = exercicios[idx];
  const {prefSel,sufSel} = setup;
  const hasPref = prefSel.length>0;
  const hasSuf  = sufSel.length>0;

  // palavra montada: prefixo + base + sufixo1 + sufixo2
  const word = (pre||"") + ex.base + (suf1||"") + (suf2||"");
  const tentEx = tentativas.filter(t=>t.exIdx===idx);
  const jaUsou = tentEx.some(t=>t.word===word);
  const canReg = (pre||suf1||suf2) && !jaUsou;
  const validasEx = tentEx.filter(t=>t.certo).length;

  // sufixo1 selecionado bloqueia suf2 de ser o mesmo
  const sufDisponiveis = sufSel.map(i=>SUFIXOS_DISPLAY[i]);

  function handleSuf1(s){
    if(suf1===s){ setSuf1(null); }
    else {
      setSuf1(s);
      if(suf2===s) setSuf2(null); // evita duplicar
    }
  }
  function handleSuf2(s){
    if(suf2===s){ setSuf2(null); }
    else {
      setSuf2(s);
      if(suf1===s) setSuf1(null);
    }
  }

  // preview visual: slots
  const slotStyle = (val, color, br) => ({
    minWidth:58, padding:"9px 12px", textAlign:"center",
    background:val?color:"#f5f5f5", color:val?"#fff":"#ccc",
    fontSize:17, fontWeight:700, border:"2px solid "+(val?color:"#eee"),
    borderRadius:br, minHeight:44,
    display:"flex", alignItems:"center", justifyContent:"center", transition:"all .2s",
  });

  return(
    <div style={{maxWidth:680,width:"100%"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <button onClick={onBack} style={{background:"none",border:"none",color:"#bbb",fontSize:13,cursor:"pointer"}}>← Sair</button>
        <p style={{color:"#888",fontSize:13,margin:0}}>Base {idx+1} de {total}</p>
        <Chip bg="#FFF3E0" c="#F4A821">⭐ {score} pts</Chip>
      </div>

      <div style={{height:6,background:"#eee",borderRadius:4,marginBottom:16,overflow:"hidden"}}>
        <div style={{height:"100%",width:((idx+1)/total*100)+"%",background:"linear-gradient(90deg,#F4A821,#FFD166)",borderRadius:4,transition:"width .4s"}}/>
      </div>

      <div style={{background:"#fff",borderRadius:22,padding:"22px 24px",boxShadow:"0 8px 32px #00000010"}}>

        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <div>
            <p style={{color:"#aaa",fontSize:12,margin:0}}>Base atual</p>
            <p style={{color:"#2B2D42",fontSize:28,fontWeight:700,fontFamily:"'Fredoka One',cursive",margin:"2px 0 0",letterSpacing:1}}>{ex.base}</p>
          </div>
          {tentEx.length>0&&(
            <div style={{textAlign:"right"}}>
              <p style={{fontSize:10,color:"#aaa",margin:0,fontWeight:700,textTransform:"uppercase"}}>V\u00e1lidas</p>
              <p style={{fontSize:22,fontWeight:700,color:"#38A169",margin:"2px 0 0"}}>{validasEx} ✓</p>
            </div>
          )}
        </div>

        {/* Preview da palavra */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:3,margin:"18px 0 6px",flexWrap:"wrap"}}>
          {hasPref&&(
            <div style={slotStyle(pre,"#C1121F","14px 3px 3px 14px")}>{pre||"\u2014"}</div>
          )}
          <div style={{padding:"9px 22px",background:"#F4A821",color:"#fff",fontSize:23,fontWeight:700,
            letterSpacing:1,border:"2px solid #F4A821",borderRadius:3,
            boxShadow:"0 4px 14px #F4A82122",display:"flex",alignItems:"center"}}>
            {ex.base}
          </div>
          {hasSuf&&(
            <div style={slotStyle(suf1,"#0077B6","3px 3px 3px 3px")}>{suf1||"\u2014"}</div>
          )}
          {hasSuf&&(
            <div style={slotStyle(suf2,"#005f8e","3px 14px 14px 3px")}>{suf2||"\u2014"}</div>
          )}
        </div>

        {/* Palavra formada */}
        {(pre||suf1||suf2)?(
          <p style={{textAlign:"center",fontSize:14,color:"#888",margin:"4px 0 16px",fontStyle:"italic"}}>
            → <strong style={{color:"#2B2D42",fontSize:16}}>{word}</strong>
          </p>
        ):<div style={{height:22}}/>}

        {/* Legenda slots */}
        {hasSuf&&(
          <div style={{display:"flex",gap:8,justifyContent:"center",marginBottom:14,flexWrap:"wrap"}}>
            <span style={{fontSize:12,color:"#0077B6",fontWeight:700,background:"#E0F4FF",padding:"3px 10px",borderRadius:20}}>⇒ Sufixo 1</span>
            <span style={{fontSize:12,color:"#005f8e",fontWeight:700,background:"#d0ecfa",padding:"3px 10px",borderRadius:20}}>⇒ Sufixo 2 (opcional)</span>
          </div>
        )}

        {/* Prefixos */}
        {hasPref&&(
          <div style={{marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <p style={lbl}>⇐ Prefixos</p>
              {pre&&<button onClick={()=>setPre(null)} style={{background:"none",border:"none",color:"#C1121F",fontSize:11,cursor:"pointer",fontWeight:700,paddingBottom:8}}>✕ Remover</button>}
            </div>
            <div style={{display:"flex",flexWrap:"wrap"}}>
              {prefSel.map(p=>(
                <AfixoBtn key={p} text={p+"\u2013"} selected={pre===p} color="#C1121F" onClick={()=>setPre(pre===p?null:p)}/>
              ))}
            </div>
          </div>
        )}

        {/* Sufixos — dois slots */}
        {hasSuf&&(
          <div style={{marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <p style={lbl}>⇒ Sufixos (clique 1x = sufixo 1, 2x = sufixo 2)</p>
              {(suf1||suf2)&&<button onClick={()=>{setSuf1(null);setSuf2(null);}} style={{background:"none",border:"none",color:"#0077B6",fontSize:11,cursor:"pointer",fontWeight:700,paddingBottom:8}}>✕ Limpar</button>}
            </div>
            <div style={{display:"flex",flexWrap:"wrap"}}>
              {sufDisponiveis.map((s,i)=>{
                const isSuf1 = suf1===s;
                const isSuf2 = suf2===s;
                const color = isSuf2?"#005f8e":"#0077B6";
                return(
                  <AfixoBtn key={i} text={"\u2013"+s+(isSuf1?" \u2460":isSuf2?" \u2461":"")}
                    selected={isSuf1||isSuf2} color={color}
                    onClick={()=>{
                      if(!suf1&&!isSuf2){ handleSuf1(s); }
                      else if(isSuf1){ setSuf1(null); }
                      else if(!suf2){ handleSuf2(s); }
                      else if(isSuf2){ setSuf2(null); }
                      else { handleSuf1(s); }
                    }}/>
                );
              })}
            </div>
            <p style={{fontSize:11,color:"#aaa",margin:"6px 0 0"}}>
              ① = sufixo 1  |  ② = sufixo 2  |  Clique novamente para desmarcar
            </p>
          </div>
        )}

        {/* Tentativas */}
        {tentEx.length>0&&(
          <div style={{background:"#f8f8f8",borderRadius:12,padding:"10px 14px",marginBottom:14}}>
            <p style={{fontSize:11,color:"#bbb",fontWeight:700,textTransform:"uppercase",margin:"0 0 8px"}}>Tentativas nesta base</p>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {tentEx.map((t,i)=>(
                <span key={i} style={{padding:"4px 14px",borderRadius:20,fontSize:13,fontWeight:700,
                  background:t.certo?"#F0FFF4":"#FFF5F5",
                  color:t.certo?"#276749":"#C53030",
                  border:"1.5px solid "+(t.certo?"#9AE6B4":"#FEB2B2")}}>
                  {t.certo?"✓":"✗"} {t.word}
                </span>
              ))}
            </div>
          </div>
        )}

        {/* Botões registar */}
        <div style={{display:"flex",gap:10,marginTop:4}}>
          <button onClick={()=>onRegistrar(word,pre,suf1,suf2,true)} disabled={!canReg}
            style={{flex:3,padding:13,background:canReg?"#38A169":"#ebebeb",color:canReg?"#fff":"#ccc",border:"none",borderRadius:50,fontSize:15,fontFamily:"inherit",fontWeight:700,cursor:canReg?"pointer":"not-allowed",transition:"all .2s"}}>
            {jaUsou?"J\u00e1 tentada":"✓ Existe! (+10 pts)"}
          </button>
          <button onClick={()=>onRegistrar(word,pre,suf1,suf2,false)} disabled={!canReg}
            style={{flex:2,padding:13,background:canReg?"#FFF5F5":"#ebebeb",color:canReg?"#C53030":"#ccc",border:"2px solid "+(canReg?"#FEB2B2":"#e8e8e8"),borderRadius:50,fontSize:15,fontFamily:"inherit",fontWeight:700,cursor:canReg?"pointer":"not-allowed",transition:"all .2s"}}>
            ✗ Não existe
          </button>
        </div>

        <button onClick={onNext}
          style={{width:"100%",marginTop:10,padding:11,background:"#fff",color:"#aaa",border:"2px solid #eee",borderRadius:50,fontSize:14,fontFamily:"inherit",fontWeight:700,cursor:"pointer",transition:"all .2s"}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor="#F4A821";e.currentTarget.style.color="#F4A821"}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor="#eee";e.currentTarget.style.color="#aaa"}}>
          {idx<total-1?"Pr\u00f3xima base \u2192":"Ver Resultado 🎉"}
        </button>
      </div>
    </div>
  );
}

function ResultScreen({score,tentativas,exercicios,setup,onRestart,onNew}){
  const validas   = tentativas.filter(t=>t.certo);
  const invalidas = tentativas.filter(t=>!t.certo);
  const pct = tentativas.length?Math.round(validas.length/tentativas.length*100):0;
  const [emoji,sc] = pct>=70?["🌟 Excelente!","#1B7A45"]:pct>=40?["👍 Bom trabalho!","#B5601A"]:["📖 Continue praticando","#AE2012"];
  const sufNomes = setup.sufSel.map(i=>SUFIXOS_DISPLAY[i]);

  return(
    <div style={{maxWidth:580,width:"100%"}}>
      <div style={{textAlign:"center",marginBottom:22}}>
        <div style={{fontSize:56,marginBottom:4}}>🏆</div>
        <h2 style={{fontFamily:"'Fredoka One',cursive",fontSize:28,color:"#2B2D42",margin:0}}>Sessão Concluída!</h2>
        <p style={{fontSize:40,fontWeight:700,color:"#F4A821",margin:"8px 0 4px"}}>⭐ {score} pts</p>
        <span style={{background:sc+"22",color:sc,padding:"6px 18px",borderRadius:20,fontWeight:700,fontSize:14}} dangerouslySetInnerHTML={{__html:emoji}}/>
      </div>

      {validas.length>0&&(
        <div style={{background:"#fff",borderRadius:18,padding:"16px 20px",marginBottom:12,boxShadow:"0 4px 18px #0000000b"}}>
          <p style={{fontWeight:700,fontSize:14,color:"#276749",margin:"0 0 10px"}}>✓ Palavras v\u00e1lidas ({validas.length})</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {validas.map((t,i)=>(
              <span key={i} style={{background:"#F0FFF4",color:"#276749",border:"1.5px solid #9AE6B4",padding:"5px 14px",borderRadius:20,fontSize:14,fontWeight:700}}>{t.word}</span>
            ))}
          </div>
        </div>
      )}

      {invalidas.length>0&&(
        <div style={{background:"#fff",borderRadius:18,padding:"16px 20px",marginBottom:12,boxShadow:"0 4px 18px #0000000b"}}>
          <p style={{fontWeight:700,fontSize:14,color:"#C53030",margin:"0 0 10px"}}>✗ N\u00e3o existem ({invalidas.length})</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {invalidas.map((t,i)=>(
              <span key={i} style={{background:"#FFF5F5",color:"#C53030",border:"1.5px solid #FEB2B2",padding:"5px 14px",borderRadius:20,fontSize:14,fontWeight:700}}>{t.word}</span>
            ))}
          </div>
        </div>
      )}

      <div style={{background:"#F3E8FF",borderRadius:16,padding:"16px 18px",marginBottom:16}}>
        <p style={{fontWeight:700,fontSize:14,color:"#7209B7",margin:"0 0 12px"}}>👩‍⚕️ Relat\u00f3rio para Fonoaudi\u00f3logo</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {[["Pontua\u00e7\u00e3o",score+" pts"],["Tentativas",tentativas.length],["V\u00e1lidas",validas.length+" ("+pct+"%)"],["Inv\u00e1lidas",invalidas.length]].map(([k,v])=>(
            <div key={k} style={{background:"#fff",borderRadius:10,padding:"8px 12px"}}>
              <p style={{color:"#bbb",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1,margin:0}}>{k}</p>
              <p style={{color:"#444",fontSize:12,fontWeight:700,margin:"3px 0 0"}}>{v}</p>
            </div>
          ))}
          {[["Bases",exercicios.map(e=>e.base).join(", ")],["Prefixos",setup.prefSel.join(", ")||"\u2014"],["Sufixos",sufNomes.join(", ")||"\u2014"]].map(([k,v])=>(
            <div key={k} style={{background:"#fff",borderRadius:10,padding:"8px 12px",gridColumn:"span 2"}}>
              <p style={{color:"#bbb",fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:1,margin:0}}>{k}</p>
              <p style={{color:"#444",fontSize:12,fontWeight:700,margin:"3px 0 0",wordBreak:"break-word"}}>{v}</p>
            </div>
          ))}
        </div>
      </div>

      <div style={{display:"flex",gap:10}}>
        <button onClick={onNew} style={{flex:1,padding:13,background:"#fff",color:"#7209B7",border:"2.5px solid #7209B7",borderRadius:50,fontSize:14,fontFamily:"inherit",fontWeight:700,cursor:"pointer"}}>🎮 Nova Sess\u00e3o</button>
        <button onClick={onRestart} style={{flex:1,padding:13,background:"#F4A821",color:"#fff",border:"none",borderRadius:50,fontSize:14,fontFamily:"inherit",fontWeight:700,cursor:"pointer"}}>🏠 In\u00edcio</button>
      </div>
    </div>
  );
}

function App(){
  const [screen,setScreen]   = useState("home");
  const [setup,setSetup]     = useState({radInput:"",prefSel:[],sufSel:[]});
  const [exercicios,setExs]  = useState([]);
  const [idx,setIdx]         = useState(0);
  const [pre,setPre]         = useState(null);
  const [suf1,setSuf1]       = useState(null);
  const [suf2,setSuf2]       = useState(null);
  const [tentativas,setTent] = useState([]);
  const [score,setScore]     = useState(0);

  function resetGame(){ setIdx(0);setPre(null);setSuf1(null);setSuf2(null);setTent([]);setScore(0); }

  function startGame(){
    const bases=setup.radInput.split(",").map(r=>r.trim()).filter(Boolean);
    setExs(bases.map((base,i)=>({id:i+1,base})));
    resetGame();
    setScreen("game");
  }

  function registrar(word,p,s1,s2,certo){
    setTent(t=>[...t,{exIdx:idx,word,pre:p,suf1:s1,suf2:s2,certo}]);
    if(certo) setScore(sc=>sc+10);
    setPre(null);setSuf1(null);setSuf2(null);
  }

  function nextExercise(){
    setPre(null);setSuf1(null);setSuf2(null);
    if(idx<exercicios.length-1) setIdx(i=>i+1);
    else setScreen("result");
  }

  return(
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20,fontFamily:"'Nunito',sans-serif",background:"linear-gradient(145deg,#fffbe6 0%,#e0f4ff 55%,#f3e8ff 100%)"}}>
      <style>{"@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap');*{box-sizing:border-box;margin:0;padding:0}button:focus-visible{outline:2px solid #F4A821;outline-offset:2px}"}</style>
      {screen==="home"&&<HomeScreen onStart={()=>setScreen("setup")}/>}
      {screen==="setup"&&<SetupScreen setup={setup} setSetup={setSetup} onGo={startGame} onBack={()=>setScreen("home")}/>}
      {screen==="game"&&exercicios[idx]&&<GameScreen exercicios={exercicios} setup={setup} pre={pre} setPre={setPre} suf1={suf1} setSuf1={setSuf1} suf2={suf2} setSuf2={setSuf2} tentativas={tentativas} score={score} idx={idx} total={exercicios.length} onRegistrar={registrar} onNext={nextExercise} onBack={()=>{resetGame();setScreen("setup");}}/>}
      {screen==="result"&&<ResultScreen score={score} tentativas={tentativas} exercicios={exercicios} setup={setup} onRestart={()=>{resetGame();setSetup({radInput:"",prefSel:[],sufSel:[]});setScreen("home");}} onNew={()=>{resetGame();setScreen("setup");}}/>}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
